<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SURVIVE_THE_DAWN - True 3D</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js CDN for True 3D graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container">
        <!-- UI Header -->
        <div id="ui-hud">
            <div>Time: <span id="time-display">02:00 AM</span></div>
            <div>Car Repair: <span id="repair-progress">0%</span></div>
            <div>Squad Alive: <span id="squad-status">5 / 5</span></div>
        </div>

        <!-- 3D Viewport Container -->
        <div id="canvas-container"></div>

        <!-- Bottom Controls Bar -->
        <div id="controls-bar">
            <div style="font-size: 11px; color: #888;">👆 Drag to move Meme Boss in 3D</div>
            <div style="display: flex; gap: 6px;">
                <button id="switch-btn" onclick="switchCharacter()">🔄 SWITCH</button>
                <button id="action-btn" onclick="performAction()">🛠️ FIX CAR</button>
            </div>
        </div>
    </div>

    <!-- Ending Screen Overlay -->
    <div id="ending-screen" class="hidden">
        <h1 id="ending-title">THE END</h1>
        <p id="ending-msg"></p>
        <p style="color: #00ffcc; font-weight: bold; margin-top: 15px;">Thanks for Playing, Boss!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
