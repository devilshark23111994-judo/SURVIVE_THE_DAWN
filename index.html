<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SURVIVE_THE_DAWN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <!-- UI Header -->
        <div id="ui-hud">
            <div>Time: <span id="time-display">02:00 AM</span></div>
            <div>Car Repair: <span id="repair-progress">0%</span></div>
            <div>Lives / Squad: <span id="squad-status">5 / 5 Alive</span></div>
        </div>

        <!-- Game Canvas (Landscape View with Touch Controls) -->
        <canvas id="gameCanvas" width="800" height="250"></canvas>

        <!-- Bottom Action Bar -->
        <div id="controls-bar">
            <div style="font-size: 13px; color: #aaa;">💡 Drag anywhere on screen to move</div>
            <div style="display: flex; gap: 10px;">
                <button id="switch-btn" onclick="switchCharacter()">🔄 SWITCH</button>
                <button id="action-btn" onclick="performAction()">🛠️ FIX CAR</button>
            </div>
        </div>
    </div>

    <!-- Cinematic / Ending Overlay -->
    <div id="ending-screen" class="hidden">
        <h1 id="ending-title">THE END</h1>
        <p id="ending-msg"></p>
        <p style="color: #00ffcc; font-weight: bold; margin-top: 20px;">Thanks for Playing, Boss!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
